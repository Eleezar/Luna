name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q -o luna-project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Download Russian speech model
        run: curl -L -o model-ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip

      - name: Build
        run: gradle assembleDebug

      - name: Check APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l $APK
          unzip -tq $APK
          sha256sum $APK

      - name: Publish APK and model to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s $APK)
          gh release create "build-${{ github.run_number }}" $APK model-ru.zip --latest --title "Luna build ${{ github.run_number }}" --notes "APK size: $SIZE bytes"
